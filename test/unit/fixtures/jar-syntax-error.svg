<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" style="width:533px;height:367px;background:#FFFFFF;" width="533px" height="367px" viewBox="0 0 533 367" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="532.195" height="223.035" fill="#FFF" style="stroke:#FFF;stroke-width:1;"/><text x="5" y="17.457" fill="#000" font-size="12" textLength="130.002" font-weight="700">Welcome to PlantUML!</text><text x="5" y="32.551" fill="#000" font-size="12"> </text><text x="5" y="47.645" fill="#000" font-size="12" textLength="245.42">You can start with a simple UML Diagram like:</text><text x="5" y="62.738" fill="#000" font-size="12"> </text><text x="5" y="77.439" fill="#000" font-size="12" textLength="122.42" font-family="monospace">Bob->Alice: Hello</text><text x="5" y="93.5" fill="#000" font-size="12"> </text><text x="5" y="108.594" fill="#000" font-size="12" textLength="13.33">Or</text><text x="5" y="123.688" fill="#000" font-size="12"> </text><text x="5" y="138.389" fill="#000" font-size="12" textLength="93.615" font-family="monospace">class Example</text><text x="5" y="154.449" fill="#000" font-size="12"> </text><text x="5" y="169.543" fill="#000" font-size="12" textLength="301.482">You will find more information about PlantUML syntax on</text><text x="309.816" y="169.543" fill="#000" font-size="12" textLength="107.379" text-decoration="underline">https://plantuml.com</text><text x="5" y="184.637" fill="#000" font-size="12"> </text><text x="5" y="200.305" fill="#000" font-size="12" textLength="92.039">(Details by typing</text><text x="100.373" y="199.338" fill="#000" font-size="12" textLength="50.408" font-family="monospace">license</text><text x="154.115" y="200.305" fill="#000" font-size="12" textLength="48.68">keyword)</text><text x="5" y="215.398" fill="#000" font-size="12"> </text><image width="80"