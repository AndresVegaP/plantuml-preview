<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 430 304" width="430" height="304"><defs/><g><text x="5" y="16" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">An error has occurred!</text><text x="5" y="30" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-style="italic" font-family="sans-serif">Activate the Omega Thirteen.</text><text x="5" y="44" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> </text><text x="5" y="58" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">PlantUML ($version$) has crashed.</text><text x="5" y="72" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> </text><text x="5" y="86" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">Diagram size: 5 lines / 72 characters.</text><text x="5" y="100" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> </text><text x="5" y="114" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">For some reason, dot/GraphViz has crashed.</text><text x="5" y="128" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> </text><text x="5" y="142" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">RootCause java.io.IOException: Error: simulated Graphviz failure</text><text x="5" y="156" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">java.io.IOException: Error: simulated Graphviz failure</text><text x="5" y="170" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">  </text><text x="5" y="184" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">Caused by java.lang.RuntimeException: Error: simulated Graphviz failure</text><text x="5" y="198" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> </text><text x="5" y="212" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> </text><text x="5" y="226" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> </text><text x="5" y="240" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">Please go to https://plantuml.com/graphviz-dot to check your GraphViz version.</text><text x="5" y="254" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> </text><text x="5" y="268" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">You should send this diagram and this image to </text><text x="260.05" y="268" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-weight="bold" font-family="sans-serif">plantuml@gmail.com</text><text x="381.10" y="268" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> or</text><text x="5" y="282" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">post to </text><text x="44.36" y="282" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-weight="bold" font-family="sans-serif">https://plantuml.com/qa</text><text x="179.69" y="282" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> to solve this issue.</text><text x="5" y="296" font-size="12" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">You can try to turn around this issue by simplifing your diagram.